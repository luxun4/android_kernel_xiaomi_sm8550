name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      TOOLCHAIN_DIR: ${{ github.workspace }}/clang
      KERNEL_DIR: ${{ github.workspace }}/android_kernel_xiaomi_sm8550
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      DEFCONFIG: gki_defconfig

    steps:
      - name: Checkout kernel repo
        uses: actions/checkout@v3
        with:
          ref: lineage-21

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            clang llvm lld \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libncurses-dev make git curl wget ccache

      - name: Download and setup AOSP Clang
        run: |
          mkdir -p $TOOLCHAIN_DIR
          cd $TOOLCHAIN_DIR
          if [ ! -d "clang" ]; then
            wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r450784d.tar.gz -O clang.tar.gz
            tar -xf clang.tar.gz
          fi
          export PATH=$TOOLCHAIN_DIR/clang/bin:$PATH

      - name: Build Kernel
        run: |
          cd $KERNEL_DIR
          make O=out ARCH=$ARCH $DEFCONFIG
          make -j$(nproc) O=out ARCH=$ARCH \
            CC=clang \
            LD=ld.lld \
            HOSTCC=gcc \
            CROSS_COMPILE=$CROSS_COMPILE

      - name: Archive kernel image
        run: |
          cd $KERNEL_DIR/out
          tar czf kernel-build.tar.gz *
        uses: actions/upload-artifact@v3
        with:
          name: kernel-build
          path: $KERNEL_DIR/out/kernel-build.tar.gz