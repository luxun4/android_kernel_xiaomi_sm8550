name: Build Kernel

on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y binutils gcc bison flex libssl-dev libncurses-dev bc git curl wget ccache aria2

      - name: Build Kernel
        uses: luxun4/kernel_build_action@main
        with:
          kernel-url: https://github.com/luxun4/android_kernel_xiaomi_sm8550
          kernel-dir: sm8550
          kernel-branch: lineage-21
          config: gki_defconfig
          arch: arm64

          aosp-clang: true      # 使用我修复版 action 自动拉 clang-r450784d
          aosp-gcc: true        # 必须启用，否则报错 127
          disable-lto: true     # 防止 LTO 报错
          ksu: true
          ksu-version: main
          anykernel3: true