name: Build Kernel

on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y binutils gcc bison flex libssl-dev libncurses-dev bc git curl wget ccache

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/luxun4/android_kernel_xiaomi_sm8550
          kernel-dir: sm8550
          kernel-branch: lineage-21
          config: gki_defconfig
          arch: arm64

          # 开启 AOSP 工具链（注意：必须都为 true）
          aosp-clang: true
          aosp-gcc: true

          # 不用 proton-clang
          other-clang-url: ""
          other-clang-branch: ""

          # KSU 和其他选项
          ksu: true
          ksu-version: main

          disable-lto: true
          anykernel3: true

          # 不设置 extra-cmd
          extra-cmd: ""