name: Build Kernel

on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y binutils gcc bison flex libssl-dev libncurses-dev bc

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/luxun4/android_kernel_xiaomi_sm8550
          kernel-dir: .
          kernel-branch: lineage-21
          config: gki_defconfig
          arch: arm64

          aosp-clang: false
          other-clang-url: https://github.com/kdrag0n/proton-clang.git
          other-clang-branch: master

          ksu: true
          ksu-version: main

          disable-lto: true
          anykernel3: true

          # 强制使用兼容的 ld.lld 避免 glibc 冲突
          extra-cmd: "LD=ld.lld HOSTLD=ld.lld"