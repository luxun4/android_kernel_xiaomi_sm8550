name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Kernel Repo
        uses: actions/checkout@v3
        with:
          repository: luxun4/android_kernel_xiaomi_sm8550
          ref: lineage-21

      - name: Install Dependencies
        run: sudo apt update && sudo apt install -y aria2 ccache bc bison flex libncurses-dev libssl-dev gcc make git curl wget

      - name: Build Kernel
        uses: luxun4/kernel_build_action@main
        with:
          kernel-url: https://github.com/luxun4/android_kernel_xiaomi_sm8550
          kernel-dir: sm8550
          kernel-branch: lineage-21
          config: gki_defconfig
          arch: arm64
          aosp-clang: true
          aosp-gcc: true
          disable-lto: true
          ksu: true
          ksu-version: main
          anykernel3: true